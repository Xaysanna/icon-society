name: Archive Guard
on: [push]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôles sécurité du site
        run: |
          python3 - <<'EOF'
          import re, hashlib, base64
          html = open('index.html', encoding='utf-8').read()
          assert 'Content-Security-Policy' in html, 'CSP manquante'
          assert not re.search(r'<script[^>]+src=', html), 'script externe detecte'
          assert not re.search(r'\son(error|click|load|mouseover|focus)=', html), 'handler inline detecte'
          s = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(s) == 1, f'{len(s)} blocs script (1 attendu)'
          t = s[0].replace('\r\n', '\n').replace('\r', '\n')
          h = 'sha256-' + base64.b64encode(hashlib.sha256(t.encode()).digest()).decode()
          assert h in html, f'hash CSP obsolete — relancer tools/update_csp_hash.py (attendu {h})'
          m = re.search(r"script-src [^;]*", html).group(0)
          assert 'unsafe-inline' not in m, 'unsafe-inline reintroduit dans script-src'
          print('Archive Guard: OK —', h)
          EOF
